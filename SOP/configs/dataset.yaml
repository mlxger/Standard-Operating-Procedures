# Dataset configuration for SOP monitoring
path: ./data  # 数据集根目录
train: raw/train/images
val: raw/val/images
test: raw/test/images

# 类别定义 (根据实际情况修改)
names:
  0: screwdriver        # 螺丝刀
  1: wrench            # 扳手
  2: pliers            # 钳子
  3: screw             # 螺丝
  4: nut               # 螺母
  5: bolt              # 螺栓
  6: component_A       # 零件A
  7: component_B       # 零件B
  8: glue_bottle       # 胶水瓶
  9: hand_left         # 左手
  10: hand_right       # 右手

nc: 11  # 类别数量